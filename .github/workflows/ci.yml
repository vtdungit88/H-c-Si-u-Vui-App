name: CI
on:
  push:
    branches: [feature/mvp-web-supabase, main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile check)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund --package-lock; fi
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            package-lock.json
          retention-days: 7
