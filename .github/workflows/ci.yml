name: CI
on:
  push:
    branches: [feature/mvp-web-supabase, main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile check)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund --package-lock; fi
      - run: npm run lint
      - run: npm run build
      - name: Guard - no quiz answers or secrets in the browser bundle
        run: |
          ! grep -rEl "isCorrect:(!0|true)" dist/assets/*.js || { echo "answer data found in bundle"; exit 1; }
          ! grep -rEl "service_role|sb_secret_" dist || { echo "secret found in bundle"; exit 1; }
          echo "bundle clean"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            package-lock.json
          retention-days: 7
  e2e:
    # Manual: creates throwaway accounts in Supabase. Requires Auth > Email > 'Confirm email' OFF.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: E2E against Supabase (publishable key only)
        run: node tests/e2e-supabase.mjs
        env:
          VITE_SUPABASE_URL: https://owqbwykjabwevkbjroym.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mFToduXSchitIMvx1HWQaw_JWrWD3IG
  layout:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Build (Pages base path)
        run: npm run build
        env:
          VITE_BASE: /hocsieuvui/
          VITE_SUPABASE_URL: https://owqbwykjabwevkbjroym.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mFToduXSchitIMvx1HWQaw_JWrWD3IG
      - name: Serve and check responsive layout (phone / tablet / desktop)
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/hocsieuvui/ >/dev/null && break; sleep 1; done
          PREVIEW_URL=http://127.0.0.1:4173/hocsieuvui/ node tests/layout-check.mjs
