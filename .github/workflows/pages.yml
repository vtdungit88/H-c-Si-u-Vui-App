name: Deploy Preview (GitHub Pages)
on:
  push:
    branches: [feature/mvp-web-supabase]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Build for the custom root domain
        run: npm run build
        env:
          # vnptluongson.cloud is served from the domain root, not /hocsieuvui/.
          VITE_BASE: /
          VITE_SUPABASE_URL: https://owqbwykjabwevkbjroym.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify built asset paths
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          if (!html.includes('src="/assets/')) {
            console.error('Expected root-relative JS asset path in dist/index.html');
            process.exit(1);
          }
          if (html.includes('/hocsieuvui/assets/')) {
            console.error('Project-site asset path detected; custom domain requires /assets/.');
            process.exit(1);
          }
          console.log('Custom-domain asset paths verified.');
          NODE
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
